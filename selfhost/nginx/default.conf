# Fitdraw all-in-one vhost.
#
#   /                static Excalidraw bundle (patched)
#   /socket.io/      excalidraw-room          (127.0.0.1:3002)
#   /mcp             excalidraw-mcp server    (127.0.0.1:3001)
#   /api/v2/         encrypted scene store    (127.0.0.1:3003)
#   /mcp-ui/         mirrored MCP App UI modules
#   /healthz         supervisor liveness

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 16m;

    # Kept out of the access log: scene ids and MCP payloads are opaque but
    # still user content.
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Chrome now denies `unload` unless the document opts in, which blocks the
    # handlers Excalidraw registers (flush the local save, tear down the collab
    # socket, blur the editor) and logs "Permissions policy violation: unload is
    # not allowed in this document." in DevTools. Opt back in for this origin;
    # drop the header to follow Chrome's new default. See docs/self-hosting.md.
    add_header Permissions-Policy "unload=(self)" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/manifest+json image/svg+xml text/xml application/xml;

    # ---- health ------------------------------------------------------------
    location = /healthz {
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    # ---- MCP streamable HTTP ----------------------------------------------
    # Stateless: every request is a complete JSON-RPC exchange, so no sticky
    # routing or session affinity is required.
    location = /mcp {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /mcp/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- encrypted scene store -------------------------------------------
    location ^~ /api/v2/ {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        proxy_request_buffering off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # Library publishing needs Excalidraw's cloud backend; the UI is hidden and
    # this returns a clear error instead of leaking the request.
    location ^~ /api/library-disabled {
        return 410;
    }

    # ---- collaboration room ----------------------------------------------
    location ^~ /socket.io/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- mirrored MCP App UI ---------------------------------------------
    # Loaded inside a sandboxed iframe (opaque origin), so the files must be
    # explicitly CORS-open. Referenced as absolute ${FITDRAW_PUBLIC_URL} URLs by
    # the import map, never root-relative.
    location ^~ /mcp-ui/ {
        alias /opt/mcp-ui/;
        autoindex off;
        add_header Access-Control-Allow-Origin   "*" always;
        add_header Cross-Origin-Resource-Policy  "cross-origin" always;
        add_header X-Content-Type-Options        "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- static frontend ---------------------------------------------------
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The SPA fallback below lands here through an internal redirect, and
    # add_header in a location replaces the server-level set, so the headers the
    # document needs are repeated (Referrer-Policy included: it was being
    # dropped for the HTML itself).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "unload=(self)" always;
    }

    # SPA fallback: Excalidraw puts the scene in the URL fragment, so any path
    # must return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
