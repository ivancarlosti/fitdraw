name: Update Excalidraw Version

# Keeps the three upstream pins Fitdraw consumes in sync, in a single commit:
#
#   .excalidraw-version       excalidraw/excalidraw release tag (frontend image)
#   .excalidraw-room-digest   excalidraw/excalidraw-room manifest digest
#   .excalidraw-mcp           excalidraw/excalidraw-mcp tag + release asset sha256
#
# The Dockerfile ARG defaults are rewritten from the same values, so local builds
# and CI always agree. Commit type `fix:` makes semantic-release cut a patch,
# which then builds and publishes the image.

on:
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write       # required to dispatch semantic-release.yml / build.yml

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch latest Excalidraw release tag
        id: excalidraw
        run: |
          set -euo pipefail
          LATEST=$(git ls-remote --tags https://github.com/excalidraw/excalidraw.git \
            | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "::error::Could not resolve the latest Excalidraw tag"
            exit 1
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Fetch latest room digest and MCP pin
        id: services
        run: |
          set -euo pipefail

          ROOM_DIGEST=$(curl -fsSL --retry 3 \
            https://hub.docker.com/v2/repositories/excalidraw/excalidraw-room/tags/latest \
            | jq -r '.digest // empty')
          if ! printf '%s' "$ROOM_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Unexpected room digest: '$ROOM_DIGEST'"
            exit 1
          fi

          MCP_JSON=$(curl -fsSL --retry 3 \
            https://api.github.com/repos/excalidraw/excalidraw-mcp/releases/latest)
          MCP_TAG=$(jq -r '.tag_name // empty' <<<"$MCP_JSON")
          MCP_SHA=$(jq -r '[.assets[] | select(.name == "excalidraw-mcp-app.mcpb") | .digest][0] // empty' <<<"$MCP_JSON" \
            | sed 's/^sha256://')
          if ! printf '%s' "$MCP_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected MCP tag: '$MCP_TAG'"
            exit 1
          fi
          if ! printf '%s' "$MCP_SHA" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Unexpected MCP asset digest: '$MCP_SHA'"
            exit 1
          fi

          {
            echo "room_digest=$ROOM_DIGEST"
            echo "mcp_tag=$MCP_TAG"
            echo "mcp_sha=$MCP_SHA"
          } >> "$GITHUB_OUTPUT"


      - name: Apply pins
        id: update_check
        env:
          FRONTEND: ${{ steps.excalidraw.outputs.latest }}
          ROOM_DIGEST: ${{ steps.services.outputs.room_digest }}
          MCP_TAG: ${{ steps.services.outputs.mcp_tag }}
          MCP_SHA: ${{ steps.services.outputs.mcp_sha }}
        run: |
          set -euo pipefail
          CHANGED=()

          CURRENT_FRONTEND=$(cat .excalidraw-version 2>/dev/null || echo none)
          if [ "$FRONTEND" != "$CURRENT_FRONTEND" ]; then
            echo "$FRONTEND" > .excalidraw-version
            CHANGED+=("frontend ${CURRENT_FRONTEND} -> ${FRONTEND}")
          fi

          CURRENT_ROOM=$(cat .excalidraw-room-digest 2>/dev/null || echo none)
          if [ "$ROOM_DIGEST" != "$CURRENT_ROOM" ]; then
            echo "$ROOM_DIGEST" > .excalidraw-room-digest
            sed -i "s|^ARG EXCALIDRAW_ROOM_DIGEST=.*|ARG EXCALIDRAW_ROOM_DIGEST=${ROOM_DIGEST}|" Dockerfile
            CHANGED+=("room")
          fi

          CURRENT_MCP_TAG=$(grep -E '^version=' .excalidraw-mcp 2>/dev/null | cut -d= -f2 || true)
          CURRENT_MCP_SHA=$(grep -E '^sha256=' .excalidraw-mcp 2>/dev/null | cut -d= -f2 || true)
          if [ "$MCP_TAG" != "$CURRENT_MCP_TAG" ] || [ "$MCP_SHA" != "$CURRENT_MCP_SHA" ]; then
            {
              echo "# Pin for excalidraw/excalidraw-mcp, consumed by the Dockerfile ARGs of the same"
              echo "# name. The update workflow rewrites both lines from the GitHub release metadata."
              echo "version=${MCP_TAG}"
              echo "sha256=${MCP_SHA}"
            } > .excalidraw-mcp
            sed -i "s|^ARG MCP_VERSION=.*|ARG MCP_VERSION=${MCP_TAG}|" Dockerfile
            sed -i "s|^ARG MCP_VERSION_SHA256=.*|ARG MCP_VERSION_SHA256=${MCP_SHA}|" Dockerfile
            CHANGED+=("mcp ${CURRENT_MCP_TAG:-none} -> ${MCP_TAG}")
          fi

          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "All pins are up to date."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Bumped: %s\n' "${CHANGED[@]}"
          printf '%s\n' "${CHANGED[@]}" > /tmp/pin-summary.txt
          echo "updated=true" >> "$GITHUB_OUTPUT"


      - name: Commit and push changes
        if: steps.update_check.outputs.updated == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .excalidraw-version .excalidraw-room-digest .excalidraw-mcp Dockerfile
          SUMMARY=$(paste -sd '; ' /tmp/pin-summary.txt)
          # Conventional type: semantic-release turns fix: into a patch release,
          # which then dispatches build.yml for the new tag.
          git commit -m "fix(deps): bump upstream pins (${SUMMARY})"
          git push origin HEAD:main


      - name: Trigger Semantic Release
        if: steps.update_check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push made with GITHUB_TOKEN does not start other workflows, so the
          # commit above never reaches semantic-release on its own. Dispatch it.
          sleep 5
          gh workflow run semantic-release.yml --ref main

      - name: Manual run with no new Excalidraw — rebuild current release
        if: steps.update_check.outputs.updated == 'false' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keeps the old "manual run forces a rebuild" behaviour: rebuild the
          # newest existing release tag without creating a new version.
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No release tag found; nothing to rebuild."
            exit 0
          fi
          echo "Rebuilding existing release ${TAG}"
          gh workflow run build.yml --ref main -f version="${TAG}"
