name: 🐳 Build Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g., v1.2.3)'
        required: true
        type: string
  schedule:
    # Mondays 04:00 UTC. Rebuild the newest vX.Y.Z release so published
    # images pick up base-image security fixes without cutting a new release.
    # Scheduled runs have no inputs; release packaging is skipped below.
    - cron: "0 4 * * 1"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: 📦 Package & Push
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout at release tag
        if: github.event_name != 'schedule'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}
          fetch-depth: 0

      # Schedule triggers on the default branch. Full history (same fetch-depth
      # as above) brings every tag so the next step can detach at the newest
      # vX.Y.Z commit; commit metadata and the :latest decision then see that tree.
      - name: 📥 Checkout default branch
        if: github.event_name == 'schedule'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🗓️ Check out newest release on schedule
        id: rebuild
        run: |
          # Release and workflow_dispatch already checked out the requested tag.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            {
              echo "proceed=true"
              echo "refresh_base=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest tag matching vX.Y.Z, using the same version sort as the
          # :latest decision below (v1.10.0 beats v1.9.0). Pre-releases
          # (v1.2.3-rc.1) and other names are ignored.
          candidates="$(git tag --sort=-v:refname)"
          TAG=""
          semver_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ $semver_re ]]; then
              TAG="$candidate"
              break
            fi
          done <<< "$candidates"

          if [ -z "$TAG" ]; then
            echo "::notice title=No semver tag::No tag matching vX.Y.Z; scheduled rebuild skipped."
            {
              echo "proceed=false"
              echo "refresh_base=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -c advice.detachedHead=false checkout --detach "$TAG"
          {
            echo "proceed=true"
            echo "refresh_base=true"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Scheduled rebuild::Rebuilding ${TAG} with a fresh base image."

      - name: 🏷️ Resolve version
        id: version
        if: steps.rebuild.outputs.proceed == 'true'
        run: |
          # release: event tag. workflow_dispatch: version input.
          # schedule: newest vX.Y.Z tag checked out above.
          TAG="${{ github.event.release.tag_name || inputs.version || steps.rebuild.outputs.tag }}"
          VERSION="${TAG#v}"
          REPO_NAME="$(basename "$GITHUB_REPOSITORY")"
          ZIP_NAME="${REPO_NAME}-${VERSION}.zip"
          # Docker registries reject path segments starting with "." or "-"
          DOCKER_REPO="${REPO_NAME#.}"
          # The commit that was actually checked out. On a release event that is
          # the tag commit; on a manual run the checkout also uses the version
          # input as its ref, so this never picks up the branch head that was
          # current when the workflow was dispatched. On a schedule, HEAD is the
          # newest vX.Y.Z tag detached above, not the default branch tip.
          COMMIT="$(git rev-parse HEAD)"

          # Highest tag in the repository (the checkout above uses fetch-depth: 0).
          # A manual dispatch may target an older tag to rebuild it, and publishing
          # that build as :latest would roll every `:latest` deployment back to an
          # older tree. So :latest only moves when the requested version is the
          # newest tag.
          LATEST_TAG="$(git tag --sort=-v:refname | head -n 1)"
          IMAGE="ghcr.io/${{ github.repository_owner }}/${DOCKER_REPO}"
          if [ "${LATEST_TAG#v}" = "${VERSION}" ]; then
            TAGS="$(printf '%s:latest\n%s:%s' "${IMAGE}" "${IMAGE}" "${VERSION}")"
          else
            TAGS="${IMAGE}:${VERSION}"
            echo "::notice title=Older release::${VERSION} is older than ${LATEST_TAG}: only :${VERSION} is published, :latest stays on ${LATEST_TAG}."
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "zip_name=$ZIP_NAME"
            echo "repo_name=$REPO_NAME"
            echo "docker_repo=$DOCKER_REPO"
            echo "commit=$COMMIT"
            echo "tags<<TAGS_EOF"
            echo "${TAGS}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 📦 Create ZIP package
        if: steps.rebuild.outputs.proceed == 'true' && github.event_name != 'schedule'
        run: |
          # docs/, plans/ and node_modules/ are intentionally kept: the zip
          # doubles as a backup.
          zip -r "${{ steps.version.outputs.zip_name }}" . \
            -x ".git/*" ".github/*" "docker/*" ".dockerignore" \
               "CNAME" "Dockerfile" "README.md" "LICENSE"

      - name: 📤 Upload ZIP to GitHub Release
        if: steps.rebuild.outputs.proceed == 'true' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.zip_name }}" --clobber

      - name: 📝 Update release with changed files
        if: steps.rebuild.outputs.proceed == 'true' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)

          # Build the "Files changed in this release" section
          SECTION="## Files changed in this release"
          SECTION+=$'\n\n'

          if [ -n "${PREV_TAG}" ]; then
            # List changed files. node_modules (when a repository tracks it) is not
            # part of what a user consumes from a release, so it is filtered out
            # of the notes.
            SECTION+="### Changed Files"
            SECTION+=$'\n\n'
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                SECTION+="- $file"
                SECTION+=$'\n'
              fi
            done < <(git diff --name-only "${PREV_TAG}".."${TAG}" 2>/dev/null | grep -v '^node_modules/' || true)

            SECTION+=$'\n'
            # List commits with messages
            SECTION+="### Commits"
            SECTION+=$'\n\n'
            while IFS= read -r commit_line; do
              if [ -n "$commit_line" ]; then
                SECTION+="- $commit_line"
                SECTION+=$'\n'
              fi
            done < <(git log --pretty=format:"%s (%h)" "${PREV_TAG}".."${TAG}" 2>/dev/null)
          else
            # First release — list all changed files and commits
            SECTION+="### Changed Files"
            SECTION+=$'\n\n'
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                SECTION+="- $file"
                SECTION+=$'\n'
              fi
            done < <(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -v '^node_modules/' || true)

            SECTION+=$'\n'
            SECTION+="### Commits"
            SECTION+=$'\n\n'
            while IFS= read -r commit_line; do
              if [ -n "$commit_line" ]; then
                SECTION+="- $commit_line"
                SECTION+=$'\n'
              fi
            done < <(git log --pretty=format:"%s (%h)" HEAD~1..HEAD 2>/dev/null)
          fi

          # Append section to release body, preserving the original title
          CURRENT_TITLE=$(gh release view "$TAG" --json name -q ".name")
          CURRENT_BODY=$(gh release view "$TAG" --json body -q ".body")
          UPDATED_BODY="${CURRENT_BODY}"$'\n\n'"${SECTION}"
          gh release edit "$TAG" --title "${CURRENT_TITLE}" --notes "${UPDATED_BODY}"

      # ---- Docker ----
      - name: 🔍 Check if Dockerfile exists
        id: dockerfile_check
        if: steps.rebuild.outputs.proceed == 'true'
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐧 Set up QEMU
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/setup-qemu-action@v4

      - name: 🛠 Set up Docker Buildx
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GitHub Container Registry
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧷 Validate upstream pins
        id: pins
        if: steps.dockerfile_check.outputs.exists == 'true'
        run: |
          set -euo pipefail

          MCP_VERSION=$(sed -n 's/^version=//p' .excalidraw-mcp)
          MCP_SHA=$(sed -n 's/^sha256=//p' .excalidraw-mcp)
          ROOM_DIGEST=$(tr -d '[:space:]' < .excalidraw-room-digest)

          for value in "$MCP_VERSION" "$MCP_SHA" "$ROOM_DIGEST"; do
            if [ -z "$value" ]; then
              echo "::error::A pin file is empty (.excalidraw-mcp / .excalidraw-room-digest)"
              exit 1
            fi
          done

          # Every ARG default must agree with the pin files; the update workflow
          # rewrites both together, so a mismatch means a half-applied bump.
          MISMATCH=$(grep -E '^ARG (MCP_VERSION|MCP_VERSION_SHA256|EXCALIDRAW_ROOM_DIGEST)=' Dockerfile \
            | grep -vE "=${MCP_VERSION}$|=${MCP_SHA}$|=${ROOM_DIGEST}$" || true)
          if [ -n "$MISMATCH" ]; then
            echo "::error::Dockerfile pins disagree with .excalidraw-* files:"
            echo "$MISMATCH"
            exit 1
          fi

          {
            echo "mcp_version=$MCP_VERSION"
            echo "mcp_sha=$MCP_SHA"
            echo "room_digest=$ROOM_DIGEST"
          } >> "$GITHUB_OUTPUT"
          echo "Pins: mcp=${MCP_VERSION} room=${ROOM_DIGEST}"

      - name: 🐳 Build and Push Docker image
        if: steps.dockerfile_check.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Weekly schedule only. "false" is the action default, so release and
          # workflow_dispatch keep their current cache behavior. "true" pulls a
          # fresh base image and disables layer cache so base CVE fixes land.
          pull: ${{ steps.rebuild.outputs.refresh_base }}
          no-cache: ${{ steps.rebuild.outputs.refresh_base }}
          # Stamp the release into the image: without these arguments the
          # Dockerfile defaults (e.g. ARG VERSION=dev / COMMIT=unknown) are used.
          # COMMIT is the commit the tag points at (not the branch head at
          # dispatch time), so `docker inspect` always resolves to the built tree.
          # The three upstream pins come from the files the update workflow
          # maintains, and every ARG default above was just checked against them.
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            EXCALIDRAW_ROOM_DIGEST=${{ steps.pins.outputs.room_digest }}
            MCP_VERSION=${{ steps.pins.outputs.mcp_version }}
            MCP_VERSION_SHA256=${{ steps.pins.outputs.mcp_sha }}
          tags: ${{ steps.version.outputs.tags }}

  smoke:
    name: 🚬 Smoke test (single arch)
    runs-on: ubuntu-latest
    needs: build
    # The scheduled job only refreshes an existing tag; the smoke test runs on
    # releases and manual rebuilds, where a broken image would be published.
    if: github.event_name != 'schedule'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}

      - name: 🏗️ Build linux/amd64 locally
        run: docker build --platform linux/amd64 -t fitdraw:smoke .

      - name: 🧪 Run container and probe endpoints
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3030:80 \
            -e FITDRAW_PUBLIC_URL=http://localhost:3030 fitdraw:smoke

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3030/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done

          curl -fsS http://localhost:3030/healthz
          curl -fsS -o /dev/null -w 'index=%{http_code}\n' http://localhost:3030/
          curl -fsS -o /dev/null -w 'mcp-ui=%{http_code}\n' http://localhost:3030/mcp-ui/manifest.json

          # Streamable HTTP MCP: list tools, then export a scene and fetch the blob.
          MCP_TOOLS=$(curl -fsS http://localhost:3030/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "$MCP_TOOLS"
          for tool in read_me create_view export_to_excalidraw save_checkpoint read_checkpoint; do
            echo "$MCP_TOOLS" | grep -q "\"$tool\"" || { echo "missing tool $tool"; exit 1; }
          done

          EXPORT=$(curl -fsS http://localhost:3030/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"export_to_excalidraw","arguments":{"json":"{\"type\":\"excalidraw\",\"version\":2,\"elements\":[],\"appState\":{},\"files\":{}}"}}}')
          echo "$EXPORT"
          echo "$EXPORT" | grep -q 'http://localhost:3030/#json=' || { echo "export did not use FITDRAW_PUBLIC_URL"; exit 1; }

          ID=$(echo "$EXPORT" | grep -o '#json=[A-Za-z0-9_-]*' | head -1 | cut -d= -f2)
          curl -fsS -o /dev/null -w "scene=$ID status=%{http_code}\n" "http://localhost:3030/api/v2/$ID"

          # The library must survive the host scrub; nothing else may.
          docker exec smoke sh -c \
            "grep -rhoE 'https?://([a-z0-9-]+[.])*excalidraw[.]com' /usr/share/nginx/html/assets | sort -u" \
            | grep -q 'libraries.excalidraw.com'
          FORBIDDEN=$(docker exec smoke sh -c \
            "grep -rhoE 'https?://([a-z0-9-]+[.]|)*excalidraw[.]com' /usr/share/nginx/html/assets | grep -v libraries | sort -u" \
            || true)
          echo "forbidden hosts: ${FORBIDDEN:-none}"
          test -z "$FORBIDDEN"

      - name: 📜 Container logs on failure
        if: failure()
        run: docker logs smoke

      - name: 🧹 Cleanup
        if: always()
        run: docker rm -f smoke || true

